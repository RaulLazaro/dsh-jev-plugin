name: Publish to npm

# Publishing is tag-driven: push a v* tag (matching the version in
# package.json) and the package goes out with provenance. npm itself is never
# touched from a branch push, so master can never publish by accident.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm provenance via OIDC
  contents: read

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: node --test test/*.mjs

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
